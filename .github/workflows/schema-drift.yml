name: Schema drift

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate minimal schema from the official spec
        run: |
          npx tsx scripts/generate-minimal-schema.ts
          npx biome format --write openapi/the-board.minimal.json
      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- openapi/the-board.minimal.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "version=$(node -e "console.log(require('./openapi/the-board.minimal.json').version)")"
              echo "stat<<EOF_STAT"
              git diff --stat -- openapi/the-board.minimal.json
              echo "EOF_STAT"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update issue
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.drift.outputs.version }}
          STAT: ${{ steps.drift.outputs.stat }}
        run: |
          title="schema drift: 公式 OpenAPI が更新されています (v${VERSION})"
          body=$(printf '公式 spec から再生成した minimal schema に差分があります。\n\n```\n%s\n```\n\n`npx tsx scripts/generate-minimal-schema.ts && npx biome format --write openapi/the-board.minimal.json` で再生成し、describe / validate の回帰テストを確認してください。' "$STAT")
          gh label create schema-drift --description "公式 OpenAPI との差分検知" --color 0E8A16 2>/dev/null || true
          existing=$(gh issue list --label schema-drift --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label schema-drift
          fi
